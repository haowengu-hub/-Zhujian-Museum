<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>竹间浑人 · 封面挑选</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;900&family=Noto+Sans+SC:wght@300;400;500&family=Cormorant+Garamond:wght@400;500&display=swap">
<style>
/* Layout: work-table. Object list on the left, all frames of the current object on the right; click a frame to make it the cover. */
:root{
  --bg:#0c0b0a;--bg2:#15130f;--bg3:#1d1a16;--line:#2b2621;--fg:#ebe3d4;--mute:#8d8476;--gilt:#c6a46c;--ok:#7fa37a;--warn:#c9774f;
  --f-display:"Noto Serif SC","Songti SC",serif;--f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif;--f-latin:"Cormorant Garamond",Georgia,serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%;background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-weight:300;font-size:14px;line-height:1.6;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
:focus-visible{outline:1px solid var(--gilt);outline-offset:2px}
.app{height:100%;display:grid;grid-template-rows:auto auto minmax(0,1fr)}
header{display:flex;align-items:center;gap:12px 24px;flex-wrap:wrap;padding-block:12px;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px));border-bottom:1px solid var(--line)}
header h1{margin:0;font-family:var(--f-display);font-weight:600;font-size:19px;letter-spacing:.16em}
.prog{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--mute);font-variant-numeric:tabular-nums}
.prog .track{width:140px;height:3px;background:var(--line)}
.prog .track i{display:block;height:100%;background:var(--gilt);transition:width .4s}
.prog b{color:var(--fg);font-weight:400}
.save{margin-left:auto;font-size:12px;color:var(--mute);letter-spacing:.06em}
.save.err{color:var(--warn)}
.body{display:grid;grid-template-columns:300px minmax(0,1fr);min-height:0}
aside{border-right:1px solid var(--line);display:grid;grid-template-rows:auto minmax(0,1fr);min-height:0}
.filters{padding:12px 14px;display:flex;flex-direction:column;gap:10px;border-bottom:1px solid var(--line)}
.tabs{display:flex;gap:4px}
.tabs button{flex:1;padding:5px 0;font-size:13px;color:var(--mute);border:1px solid var(--line)}
.tabs button[aria-pressed="true"]{color:var(--fg);border-color:var(--gilt)}
.filters input{width:100%;background:var(--bg2);border:1px solid var(--line);color:var(--fg);font:inherit;padding:6px 10px;outline:none}
.filters input:focus{border-color:var(--gilt)}
.list{overflow-y:auto;min-height:0}
.item{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:10px;align-items:center;width:100%;text-align:left;padding:7px 14px;border-bottom:1px solid #1a1714}
.item:hover{background:var(--bg2)}
.item.cur{background:var(--bg3);box-shadow:inset 2px 0 0 var(--gilt)}
.item img,.item .ph{width:48px;height:48px;object-fit:cover;background:var(--bg3);display:block}
.item b{display:block;font-weight:400;font-family:var(--f-display);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item span{display:block;font-size:11px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .st{font-size:11px;color:var(--mute);font-family:var(--f-latin)}
.item .st.done{color:var(--ok)}.item.rm{opacity:.4}.item.rm b{text-decoration:line-through}
.tidy{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:10px}
.sugg{display:flex;flex-direction:column;max-width:560px;margin-top:6px;border:1px solid var(--line);border-top:0}
.sugg button{display:grid;grid-template-columns:40px minmax(0,1fr);gap:10px;align-items:center;text-align:left;padding:6px 8px;border-top:1px solid var(--line)}
.sugg button:hover{background:var(--bg3)}.sugg img,.sugg .ph{width:40px;height:40px;object-fit:cover;background:var(--bg3);display:block}
.sugg small{display:block;color:var(--mute);font-size:11px}
.dupbox{border:1px solid #5c4330;background:#1f1610;padding:10px 14px;margin:0 0 16px;max-width:900px;font-size:13px;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.merged{font-size:12px;color:var(--mute);margin:0 0 12px}.merged button{color:var(--gilt);margin-left:6px}
.grp{display:flex;justify-content:space-between;align-items:center;gap:8px;}.gedit{font-size:11px;letter-spacing:.05em;color:var(--mute);border:1px solid var(--line);padding:1px 8px;flex:none}.gedit:hover{color:var(--gilt);border-color:var(--gilt)}
.grp{padding:14px 14px 6px;font-size:11px;letter-spacing:.2em;color:var(--gilt);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--bg);z-index:1}
main{overflow-y:auto;min-height:0;padding-block:22px 40px;padding-left:max(28px,0px);padding-right:max(28px,env(safe-area-inset-right,0px))}
.head{display:flex;align-items:flex-end;gap:10px 24px;flex-wrap:wrap;margin-bottom:6px}
.head h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:28px;letter-spacing:.06em;line-height:1.3;text-wrap:balance}
.head .meta{color:var(--mute);font-size:13px;padding-bottom:5px}
.hint{color:var(--mute);font-size:12px;margin:0 0 16px}
.frames{display:flex;flex-wrap:wrap;gap:12px}
.fr{position:relative;height:clamp(150px,24vh,270px);background:var(--bg2);flex:none;max-width:100%;outline:1px solid transparent;transition:outline-color .2s,opacity .2s}
.fr img{height:100%;width:auto;max-width:100%;display:block;object-fit:contain;cursor:pointer}
.fr:hover{outline-color:#4a4136}
.fr.cover{outline:2px solid var(--gilt);outline-offset:3px}
.fr .n{position:absolute;top:6px;left:8px;font-family:var(--f-latin);font-size:13px;color:rgba(235,227,212,.8);text-shadow:0 0 4px #000;pointer-events:none}
.fr .badge{position:absolute;top:6px;right:6px;background:var(--gilt);color:#1a140c;font-size:11px;padding:1px 7px;letter-spacing:.1em;display:none}
.fr.cover .badge{display:block}
.fr .acts{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;padding:6px 8px;background:linear-gradient(transparent,rgba(0,0,0,.75));opacity:0;transition:opacity .2s;font-size:12px}
.fr:hover .acts,.fr:focus-within .acts,.fr.hid .acts{opacity:1}
.fr .acts button{color:#e4dccd;padding:2px 4px}
.fr .acts button:hover{color:var(--gilt)}
.fr.hid img{opacity:.22}
.fr.hid::after{content:"已隐藏";position:absolute;inset:0;display:grid;place-items:center;color:var(--warn);font-size:13px;letter-spacing:.2em;pointer-events:none}
.sec{margin-top:28px;border-top:1px solid var(--line);padding-top:18px}
.sec h3{margin:0 0 4px;font-size:12px;letter-spacing:.24em;color:var(--mute);font-weight:400}
.bands{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.bands button{display:flex;align-items:center;gap:8px;padding:6px 14px 6px 8px;border:1px solid var(--line);font-family:var(--f-display);font-size:16px}
.bands button i{width:18px;height:18px;border-radius:50%;display:block}
.bands button small{font-family:var(--f-body);font-size:11px;color:var(--mute)}
.bands button.auto{border-style:dashed;border-color:#5a5146}
.bands button[aria-pressed="true"]{border-color:var(--gilt);background:var(--bg3)}
.bands button:hover{border-color:var(--gilt)}
.edit{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px 14px;margin:14px 0 18px;max-width:900px}
.edit label{display:flex;flex-direction:column;gap:4px;font-size:11px;letter-spacing:.16em;color:var(--mute);min-width:0}
.edit input,.edit select,.parts input{background:var(--bg2);border:1px solid var(--line);color:var(--fg);font:inherit;font-size:14px;letter-spacing:0;padding:6px 8px;outline:none;width:100%;min-width:0}
.edit input:focus,.edit select:focus,.parts input:focus{border-color:var(--gilt)}
.edit .chg{border-color:#6b5a3a}
.fr .grpn{position:absolute;top:6px;right:6px;display:none;align-items:center;gap:4px;background:rgba(0,0,0,.7);padding:2px 6px;font-size:12px}
.splitting .fr .grpn{display:flex}.splitting .fr .badge{display:none!important}
.fr .grpn select{background:var(--bg2);color:var(--fg);border:1px solid var(--line);font:inherit;font-size:12px}
.parts{display:flex;flex-direction:column;gap:8px;margin-top:12px;max-width:560px}
.parts div{display:grid;grid-template-columns:4em minmax(0,1fr);align-items:center;gap:8px;font-size:13px;color:var(--mute)}
@media(max-width:820px){.edit{grid-template-columns:1fr 1fr}}
.note{width:100%;max-width:560px;background:var(--bg2);border:1px solid var(--line);color:var(--fg);font:inherit;padding:8px 10px;margin-top:10px;outline:none;resize:vertical;min-height:2.6em}
.note:focus{border-color:var(--gilt)}
.core{display:flex;flex-direction:column;gap:12px;max-width:620px;margin-top:10px}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.cchip{position:relative;display:grid;grid-template-columns:26px auto;align-items:center;gap:9px;padding:6px 26px 6px 6px;border:1px solid var(--line);font-size:14px;line-height:1.25;text-align:left;min-width:132px}
.cchip:hover{border-color:#5a5146}
.cchip i{width:26px;height:26px;display:block;box-shadow:inset 0 0 0 1px rgba(255,255,255,.1)}
.cchip small{display:block;font-size:11px;color:var(--mute);font-variant-numeric:tabular-nums;margin-top:2px}
.cchip.main{border-color:var(--fg);padding-right:44px}
.cchip .mtag{position:absolute;top:5px;right:6px;font-style:normal;font-size:11px;color:#17110a;background:var(--fg);padding:0 5px;line-height:17px}
.cchip .x{position:absolute;top:2px;right:4px;width:18px;height:18px;display:grid;place-items:center;font-size:14px;color:var(--mute)}
.cchip .x:hover{color:var(--warn)}
.cst{font-weight:400;color:var(--gilt);margin-left:8px}
.crafts{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;max-width:900px}
.crafts button{padding:5px 12px;border:1px solid var(--line);font-size:13px;color:var(--mute)}
.crafts button.auto{border-style:dashed;border-color:#5a5146}
.crafts button[aria-pressed="true"]{color:var(--fg);border-color:var(--gilt);border-style:solid;background:var(--bg3)}
.crafts button .rx{margin-left:8px;color:var(--mute)}.crafts button .rx:hover{color:var(--warn)}
.crafts button em{font-style:normal;font-size:11px;color:#17110a;background:var(--gilt);padding:0 4px;margin-left:6px}
.cname{display:flex;align-items:center;gap:10px 12px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
.cname input{background:var(--bg2);border:1px solid var(--line);color:var(--fg);font:inherit;font-size:15px;font-family:var(--f-display);padding:6px 10px;width:12em;outline:none}
.cname input:focus{border-color:var(--gilt)}
.cbtns{display:flex;gap:10px;flex-wrap:wrap}
.cbtns .btn{padding:6px 14px;font-size:13px}
.cbtns .btn.on{border-color:var(--gilt);color:var(--gilt)}
.picking .fr img{cursor:crosshair}
.picking .fr .acts{display:none}
.cloupe{position:fixed;z-index:50;width:44px;height:44px;border-radius:50%;border:2px solid #fff;box-shadow:0 4px 14px rgba(0,0,0,.6);pointer-events:none;transform:translate(-50%,-135%)}

/* 展厅封面 */
#hcBtn{margin-left:8px}
#hcBtn.on{border-color:var(--gilt);color:var(--gilt)}
.hc{grid-column:2;overflow-y:auto;min-height:0;padding:22px max(28px,env(safe-area-inset-right,0px)) 40px 28px}
.hc h2{margin:0 0 4px;font-family:var(--f-display);font-weight:600;font-size:26px;letter-spacing:.04em}
.hctabs{display:flex;gap:6px;flex-wrap:wrap;margin:14px 0 10px}
.hcf{display:flex;gap:4px;margin:0 0 18px}.hcf button{padding:4px 12px;font-size:13px;color:var(--mute);border-bottom:1px solid transparent}.hcf button i{font-style:normal;font-variant-numeric:tabular-nums;opacity:.7;margin-left:2px}.hcf button[aria-pressed="true"]{color:var(--fg);border-bottom-color:var(--gilt)}
.hctabs button{padding:6px 16px;border:1px solid var(--line);font-size:14px;color:var(--mute)}
.hctabs button[aria-pressed="true"]{color:var(--fg);border-color:var(--gilt)}
.hcgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:16px 14px;max-width:1100px}
.hcg{display:flex;flex-direction:column;gap:6px;text-align:left}
.hcg .sq{aspect-ratio:1;background:var(--bg3);border:1px dashed #4a4136;overflow:hidden;display:grid;place-items:center;color:var(--mute);font-size:12px}
.hcg .sq img{width:100%;height:100%;object-fit:cover;display:block}
.hcg.set .sq{border:1px solid #6b5a3e}
.hcg:hover .sq{border-color:var(--gilt)}
.hcg.cur .sq{outline:2px solid var(--gilt);outline-offset:2px}
.hcg b{font-family:var(--f-display);font-weight:500;font-size:15px;line-height:1.3}
.hcg small{font-size:12px;color:var(--mute)}
.hcg .sq{color:#9a8f80}
.hced{margin-top:26px;border-top:1px solid var(--line);padding-top:18px;max-width:1100px}
.hced h3{margin:0 0 10px;font-family:var(--f-display);font-weight:600;font-size:20px}
.hcitems{display:flex;flex-direction:column;gap:2px;max-height:300px;overflow-y:auto;border:1px solid var(--line)}
.hcit{display:grid;grid-template-columns:44px minmax(0,1fr) auto;align-items:center;gap:10px;padding:5px 8px;text-align:left}
.hcit:hover{background:var(--bg2)}.hcit.cur{background:var(--bg3);box-shadow:inset 2px 0 0 var(--gilt)}
.hcit img,.hcit .ph{width:44px;height:44px;object-fit:cover;display:block;background:var(--bg3)}
.hcit b{display:block;font-weight:400;font-family:var(--f-display);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hcit small{display:block;font-size:11px;color:var(--mute)}
.hcit select{background:var(--bg2);color:var(--fg);border:1px solid var(--line);font:inherit;font-size:12px;padding:3px 4px}
.hcframes{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
.hcframes img{height:80px;width:auto;display:block;cursor:pointer;outline:1px solid transparent;opacity:.7}
.hcframes img.cur{outline:2px solid var(--gilt);opacity:1}.hcframes img:hover{opacity:1}
.crop{display:flex;gap:24px;flex-wrap:wrap;align-items:flex-start}
.cwrap{position:relative;display:inline-block;overflow:hidden;max-width:min(620px,100%);user-select:none;touch-action:none;cursor:crosshair}
.cwrap img{display:block}
.cbox{position:absolute;border:2px solid #fff;box-shadow:0 0 0 9999px rgba(0,0,0,.55);cursor:move}
.cside{display:flex;flex-direction:column;gap:12px;min-width:200px}
.cprev{width:160px;height:160px;border:1px solid var(--line);background:var(--bg2)}
.cside .btn.pri.done{background:transparent;color:var(--ok);border-color:var(--ok);cursor:default}
.cside .btn.pop{animation:pop .6s ease}
@keyframes pop{0%{transform:scale(1)}30%{transform:scale(1.04)}100%{transform:scale(1)}}
.csaved{margin:0;font-size:12.5px;line-height:1.6;color:var(--ok);max-width:220px}
.cside label{font-size:12px;color:var(--mute);display:flex;flex-direction:column;gap:4px}
.foot{margin-top:28px;display:flex;gap:12px;flex-wrap:wrap;align-items:center}
.btn{padding:9px 20px;border:1px solid var(--line);font-size:14px;letter-spacing:.08em}
.btn:hover{border-color:var(--gilt)}
.btn.pri{background:var(--gilt);border-color:var(--gilt);color:#17110a;font-weight:500}
.btn.pri:hover{background:#d6b67f}
.foot .k{font-size:12px;color:var(--mute)}
.banner{background:#2a1c14;color:#e7c8a8;padding:8px 20px;font-size:13px}
.empty{color:var(--mute);padding:60px 0;font-family:var(--f-display)}
@media(max-width:820px){
  body{overflow:auto}.app{height:auto;min-height:100%}
  .body{grid-template-columns:1fr}
  aside{border-right:0;border-bottom:1px solid var(--line)}
  .list{max-height:34vh}
  main{overflow:visible;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
  .fr{height:120px}.head h2{font-size:22px}.save{margin-left:0}
}
</style>

<div class="app">
  <header>
    <h1>封面挑选</h1><button class="btn" id="hcBtn" style="padding:5px 14px;font-size:13px">展厅封面</button>
    <div class="prog"><div class="track"><i id="bar" style="width:0"></i></div><span><b id="nDone">0</b> / <span id="nAll">0</span> 件已定</span></div>
    <div class="save" id="save" role="status">正在连接…</div>
  </header>
  <div class="banner" id="banner" hidden></div>
  <div class="body">
    <aside>
      <div class="filters">
        <div class="tabs" role="group" aria-label="筛选">
          <button data-f="todo" aria-pressed="true">待选</button><button data-f="done" aria-pressed="false">已定</button><button data-f="all" aria-pressed="false">全部</button>
        </div>
        <input id="q" type="search" placeholder="搜索器名或馆名" aria-label="搜索">
      </div>
      <div class="list" id="list"></div>
    </aside>
    <main id="main"></main><section class="hc" id="hc" hidden></section><datalist id="dl-mus"></datalist><datalist id="dl-city"></datalist><datalist id="dl-ex"></datalist>
  </div>

    ns.filter(n=>n>1).forEach(n=>{const k=o.k+'-'+n;const it=CACHE[k]||(CACHE[k]={...o,k,parent:o,part:n});

function craftsAuto(name,cat){let r=CRAFT.filter(([c,ks])=>ks.some(k=>(name||'').includes(k))).map(x=>x[0]);
  if(r.includes('单色釉')&&(cat!=='陶瓷'||r.length>1))r=r.filter(x=>x!=='单色釉');if(r.includes('掐丝珐琅'))r=r.filter(x=>x!=='掐丝');

  return `<div class="hced"><h3>${esc(hcLabel(hcView,g.k))} · ${g.items.length} 件</h3><p class="hint">先点一件文物，再点它的一张照片，然后拖动方框裁出正方形。${hcView==='craft'?'工艺认错的，直接在右边下拉里改主要工艺。':''}</p>
  <div class="hcitems">${g.items.map(o=>{const s_=src(coverOf(o));const cr=craftsOfP(o)||craftsAuto(P(o).name||o.name,P(o).cat||o.cat);
    return `<div class="hcit${o===hcO?' cur':''}" data-ho="${o.k}" role="button" tabindex="0">${s_?`<img src="${s_}" alt="">`:'<span class="ph"></span>'}<span><b>${esc(P(o).name||o.name)}</b><small>${esc(P(o).era||o.era)} · ${esc(cr.join('、'))}</small></span>${hcView==='craft'?`<select data-hcr="${o.k}" aria-label="主要工艺">${opts.map(c=>`<option ${c===cr[0]?'selected':''}>${c}</option>`).join('')}</select>`:`<span class="hint" style="margin:0;font-size:11px">${o.imgs.length} 帧</span>`}</div>`}).join('')}</div>
  ${hcO?`<div class="hcframes">${hcO.imgs.map(im=>`<img src="${src(im[0])}" data-hf="${im[0]}" class="${im[0]===hcImg?'cur':''}" alt="">`).join('')}</div>`:''}
  ${hcO&&hcImg?`<div class="crop"><div class="cwrap" id="cwrap"><img id="cimg" src="${src(hcImg)}" alt=""><div class="cbox" id="cbox"></div></div>
    <div class="cside"><canvas class="cprev" id="cprev" width="160" height="160"></canvas><label>大小<input type="range" id="csize" min="15" max="100" value="${Math.round(hcCrop.s*100)}"></label>
    <button class="btn pri" id="csave" data-lab="${esc(hcLabel(hcView,g.k))}">用这张做「${esc(hcLabel(hcView,g.k))}」的封面</button><p class="csaved" id="csaved" hidden>已保存。你说「同步」后，网站上这一组的入口就换成这张。</p>${((HC[hcView]||{}).g||{})[g.k]?'<button class="btn" id="cdel">取消这一组的封面</button>':''}</div></div>`:''}</div>`}
function hcBindCrop(){const img=$('#cimg'),box=$('#cbox'),wrap=$('#cwrap');if(!img)return;
  const draw=()=>{const W=img.clientWidth,H=img.clientHeight;if(!W)return;const side=hcCrop.s*Math.min(W,H);
    hcCrop.x=Math.min(Math.max(hcCrop.x,side/2/W),1-side/2/W);hcCrop.y=Math.min(Math.max(hcCrop.y,side/2/H),1-side/2/H);
    Object.assign(box.style,{width:side+'px',height:side+'px',left:(hcCrop.x*W-side/2)+'px',top:(hcCrop.y*H-side/2)+'px'});
    const c=$('#cprev').getContext('2d'),nw=img.naturalWidth,nh=img.naturalHeight,ns=hcCrop.s*Math.min(nw,nh);c.clearRect(0,0,160,160);
    try{c.drawImage(img,hcCrop.x*nw-ns/2,hcCrop.y*nh-ns/2,ns,ns,0,0,160,160)}catch(e){}hcBtnState()};
  const fit=()=>{const nw=img.naturalWidth,nh=img.naturalHeight;if(!nw)return;const mw=Math.min(620,wrap.parentElement.clientWidth-240),mh=Math.min(innerHeight*.6,480);const k=Math.min(mw/nw,mh/nh);img.style.width=Math.round(nw*k)+'px';img.style.height=Math.round(nh*k)+'px';draw()};
  if(img.complete)fit();else img.onload=fit;
  let drag=null;wrap.onpointerdown=e=>{const r=img.getBoundingClientRect();if(e.target!==box){hcCrop.x=(e.clientX-r.left)/r.width;hcCrop.y=(e.clientY-r.top)/r.height;draw()}
    drag={x:e.clientX,y:e.clientY,cx:hcCrop.x,cy:hcCrop.y};wrap.setPointerCapture(e.pointerId)};
  wrap.onpointermove=e=>{if(!drag)return;const r=img.getBoundingClientRect();hcCrop.x=drag.cx+(e.clientX-drag.x)/r.width;hcCrop.y=drag.cy+(e.clientY-drag.y)/r.height;draw()};
  wrap.onpointerup=()=>{drag=null};
  wrap.onwheel=e=>{e.preventDefault();hcCrop.s=Math.min(1,Math.max(.15,hcCrop.s*(e.deltaY>0?1.06:.94)));$('#csize').value=Math.round(hcCrop.s*100);draw()};
  $('#csize').oninput=e=>{hcCrop.s=+e.target.value/100;draw()}}
function hcIsSaved(){const sv=((HC[hcView]||{}).g||{})[hcG];return !!(sv&&hcO&&sv.k===hcO.k&&sv.img===hcImg&&Math.abs(sv.x-hcCrop.x)<.002&&Math.abs(sv.y-hcCrop.y)<.002&&Math.abs(sv.s-hcCrop.s)<.002)}
function hcBtnState(){const b=$('#csave');if(!b||b.disabled)return;const ok=hcIsSaved(),lab=b.dataset.lab;b.classList.toggle('done',ok);b.textContent=ok?`✓ 已是「${lab}」的封面`:`用这张做「${lab}」的封面`;const n=$('#csaved');if(n)n.hidden=!ok}
async function hcSave(){if(hcIsSaved())return;const b=$('#csave');b.disabled=true;b.textContent='保存中…';const g=hcG,img=$('#cimg');const c=document.createElement('canvas');c.width=c.height=160;const x=c.getContext('2d'),nw=img.naturalWidth,nh=img.naturalHeight,ns=hcCrop.s*Math.min(nw,nh);
  x.drawImage(img,hcCrop.x*nw-ns/2,hcCrop.y*nh-ns/2,ns,ns,0,0,160,160);let t=c.toDataURL('image/webp',.82);if(!t.startsWith('data:image/webp'))t=c.toDataURL('image/jpeg',.85);
  const rec={k:hcO.k,img:hcImg,x:+hcCrop.x.toFixed(4),y:+hcCrop.y.toFixed(4),s:+hcCrop.s.toFixed(4),t};const d=HC[hcView]||(HC[hcView]={g:{}});d.g[g]=rec;const ok=await hcWrite(hcView,g,rec);const st=$('#hc').scrollTop;hcRender();$('#hc').scrollTop=st;if(ok){const nb=$('#csave');if(nb){nb.classList.add('pop');setTimeout(()=>nb.classList.remove('pop'),700)}flash(`已设为「${hcLabel(hcView,g)}」的封面`)}}
/* 每一组单独存一条，几个窗口同时开着也不会互相覆盖 */
const hcId=(v,k)=>v+'_'+[...new TextEncoder().encode(k)].map(b=>b.toString(16).padStart(2,'0')).join('');
async function hcWrite(v,k,rec){try{if(db){const ref=db.collection('hcov').doc(hcId(v,k));if(rec)await ref.set({v,g:k,...rec});else await ref.delete()}else localStorage.setItem('zj-hc',JSON.stringify(HC));return true}catch(e){setSave('封面没保存上，请再点一次',true);const b=$('#csave');if(b){b.disabled=false;hcBtnState()}return false}}
$('#hcBtn').onclick=()=>{hcMode=!hcMode;$('#hcBtn').classList.toggle('on',hcMode);$('#hcBtn').textContent=hcMode?'回到逐件挑选':'展厅封面';$('#main').hidden=hcMode;$('#hc').hidden=!hcMode;if(hcMode)hcRender()};
$('#hc').addEventListener('click',async e=>{const t=e.target;
  const hfb=t.closest('[data-hcf]');if(hfb){hcF=hfb.dataset.hcf;hcRender();return}
  const hv=t.closest('[data-hv]');if(hv){hcView=hv.dataset.hv;hcG=null;hcO=null;hcImg=null;hcRender();return}
  const hg=t.closest('[data-hg]');if(hg){hcG=hg.dataset.hg;hcO=null;hcImg=null;const sv=((HC[hcView]||{}).g||{})[hcG];if(sv){hcO=D.find(o=>o.k===sv.k)||null;if(hcO){hcImg=sv.img;hcCrop={x:sv.x,y:sv.y,s:sv.s};await loadT(hcO)}}hcRender();const ed=document.querySelector('#hc .hced');if(ed)ed.scrollIntoView({behavior:'smooth',block:'start'});return}
  if(t.closest('select'))return;
  const ho=t.closest('[data-ho]');if(ho){hcO=D.find(o=>o.k===ho.dataset.ho);hcImg=null;await loadT(hcO);hcImg=coverOf(hcO);hcCrop={x:.5,y:.5,s:1};hcRender();return}
  const hf=t.closest('[data-hf]');if(hf){hcImg=hf.dataset.hf;hcCrop={x:.5,y:.5,s:1};hcRender();return}
  if(t.id==='csave'){hcSave();return}
  if(t.id==='cdel'){const d=HC[hcView];if(d&&d.g)delete d.g[hcG];await hcWrite(hcView,hcG,null);const st=$('#hc').scrollTop;hcRender();$('#hc').scrollTop=st;flash('已取消这一组的封面');return}});
$('#hc').addEventListener('change',e=>{const s_=e.target.closest('[data-hcr]');if(!s_)return;const o=D.find(x=>x.k===s_.dataset.hcr);const c=s_.value;
  const l=(craftsOfP(o)||craftsAuto(P(o).name||o.name,P(o).cat||o.cat)).filter(x=>x!==c);setPick(o,{craft:[c,...l]},true);flash(`「${P(o).name||o.name}」的主要工艺改为「${c}」`);hcRender()});
addEventListener('keydown',e=>{if(hcMode&&!e.target.matches('input,textarea,select'))e.stopImmediatePropagation()},true);
let hcSub=null;
async function hcLoad(){try{if(!db){Object.assign(HC,JSON.parse(localStorage.getItem('zj-hc')||'{}'));if(hcMode)hcRender();return}
  let first=true;
  hcSub=db.collection('hcov').onSnapshot(async snap=>{HCV.forEach(([v])=>{HC[v]={g:{}}});snap.docs.forEach(d=>{const x=d.data();if(!x||!x.v||!x.g)return;const {v,g,...rec}=x;(HC[v]||(HC[v]={g:{}})).g[g]=rec});
    if(first){first=false;/* 旧版把一个展厅的封面存在一条里，这里搬过来 */
      for(const [v] of HCV){try{const d=await db.collection('meta').doc('hc_'+v).get();if(d.exists){const old=(d.data()||{}).g||{};for(const k in old){if(!HC[v].g[k]){HC[v].g[k]=old[k];await db.collection('hcov').doc(hcId(v,k)).set({v,g:k,...old[k]})}}}}catch(e){}}}
    if(hcMode&&!document.querySelector('#cwrap:active'))hcRender()},e=>setSave('封面同步中断，请刷新页面',true))}catch(e){}}
function boot(){renderList();const first=D.find(o=>!P(o).done&&o.imgs.length>1)||D[0];open(first)}
try{picks=JSON.parse(localStorage.getItem('zj-picks')||'{}')}catch(e){}
boot();
(async()=>{
  db=window.claude?await Promise.race([window.claude.use('db'),new Promise(r=>setTimeout(()=>r(null),12000))]):null;
  if(!db){hcLoad();setSave('');const b=$('#banner');b.hidden=false;b.textContent='现在没法把选择存到云端（可能没有登录 claude.ai）。选择会暂存在这个浏览器里，登录后再打开即可同步保存。';return}
  store=db.collection('picks');setSave('已连接');hcLoad();
  let firstSnap=true;
  store.onSnapshot(s=>{
    const remote={};s.docs.forEach(d=>{remote[d.id]=d.data()});
    if(firstSnap){firstSnap=false;
      // push any local-only picks made before connecting
      Object.entries(picks).forEach(([k,p])=>{if(!remote[k]||(remote[k].t||0)<(p.t||0)){pending[k]=p;flush(k)}});
    }
    Object.entries(remote).forEach(([k,p])=>{if(!pending[k]&&!writing[k])picks[k]=p});
    renderList();if(document.activeElement&&document.activeElement.matches('#main input,#main textarea,#main select'))return;renderMain();
  },e=>setSave('同步中断，请刷新页面',true));
})();
})();
</script>
